<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Halaman Tidak Ditemukan - SIVEDOKDes</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .error-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

        }

        .error-card {

            width: 100%;

            max-width: 520px;

            background: #ffffff;

            border-radius: 16px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

        }

        .error-logo {

            width: 92px;

            height: 92px;

            object-fit: contain;

            display: block;

            margin: 0 auto 22px;

        }

        .error-code {

            font-size: 64px;

            font-weight: 700;

            line-height: 1;

            color: #0b57d0;

            margin-bottom: 14px;

        }

        .error-title {

            font-size: 24px;

            font-weight: 700;

            color: #1f2937;

            margin-bottom: 10px;

        }

        .error-text {

            font-size: 14px;

            line-height: 1.7;

            color: #6b7280;

            margin-bottom: 28px;

        }

        .error-button {

            display: inline-block;

            padding: 12px 22px;

            background: #0b57d0;

            color: #ffffff;

            text-decoration: none;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s ease;

        }

        .error-button:hover {

            opacity: 0.9;

        }

        .error-footer {

            margin-top: 28px;

            font-size: 12px;

            line-height: 1.6;

            color: #9ca3af;

        }

        @media (max-width: 480px) {

            .error-card {

                padding: 32px 22px;

            }

            .error-code {

                font-size: 52px;

            }

            .error-title {

                font-size: 21px;

            }

        }

    </style>

</head>

<body>

    <div class="error-page">

        <div class="error-card">

            <img
                src="img/logo.png"
                class="error-logo"
                alt="Logo SIVEDOKDes"
            >

            <div class="error-code">
                404
            </div>

            <div class="error-title">
                Halaman Tidak Ditemukan
            </div>

            <div class="error-text">

                Alamat atau halaman yang Anda akses
                tidak tersedia di SIVEDOKDes.

                <br>

                Periksa kembali alamat yang Anda masukkan
                atau kembali ke halaman utama.

            </div>

            <a
                href="index.html"
                class="error-button"
            >
                Kembali ke SIVEDOKDes
            </a>

            <div class="error-footer">

                Pemerintah Desa Guntung<br>

                Kecamatan Tanjung Tiram<br>

                Kabupaten Batu Bara

                <br><br>

                © 2026 SIVEDOKDes v1.0

            </div>

        </div>

    </div>

</body>

</html>
