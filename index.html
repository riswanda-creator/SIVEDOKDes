<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIVEDOKDes</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">

    <img src="img/logo.png" class="logo">

    <h1>SIVEDOKDes</h1>

    <p class="subtitle">
    Sistem Verifikasi Dokumen Elektronik Desa
</p>

    <label>Jenis Dokumen</label>

    <select id="jenis">

        <option value="APBDES">APBDES</option>

        <option value="DOMISILI">
            Surat Domisili
        </option>

        <option value="SKU">
            Surat Keterangan Usaha
        </option>

        <option value="SKTM">
            Surat Tidak Mampu
        </option>

    </select>

    <label>Tahun</label>

    <input
        type="number"
        id="tahun"
        value="2026"
    >

    <button id="generate">

        Generate Document ID

    </button>

    <div class="hasil">

        <small>Document ID</small>

        <h2 id="hasil">-</h2>

    </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
